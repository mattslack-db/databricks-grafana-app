command: ["python", "startup.py"]

# Environment variables for the deployed Databricks App.
# These are read by lib/config.py at startup.
#
# NOTE: Databricks Apps injects DATABRICKS_HOST, DATABRICKS_CLIENT_ID,
# DATABRICKS_CLIENT_SECRET (or DATABRICKS_TOKEN) and DATABRICKS_APP_PORT
# automatically — do not set those here.
env:
  # GRAFANA_BUNDLE_VOLUME_PATH: UC Volume path to the gzipped binary bundle.
  # On cold start, startup.py downloads + extracts this into bin/ (the Grafana
  # binary is ~360 MB, far above the 10 MB Apps source-file limit, so it cannot
  # ship in the app source). The app's service principal needs READ on this
  # volume (USE CATALOG + USE SCHEMA + READ VOLUME), granted at deploy time.
  - name: GRAFANA_BUNDLE_VOLUME_PATH
    value: "/Volumes/classic_stable_qh34qo_catalog/grafana_app/binaries/bin.tar.gz"

  - name: LAKEBASE_ENDPOINT_PATH
    value: "projects/grafana-app/branches/production/endpoints/primary"

  - name: LAKEBASE_DATABASE_NAME
    value: "grafana"

  # LAKEBASE_HOST: the Neon/Lakebase endpoint hostname.
  # This is the static host for the production Lakebase branch.
  - name: LAKEBASE_HOST
    value: "ep-lucky-tree-d25raxtv.database.us-east-1.cloud.databricks.com"

  # LAKEBASE_DB_USER: the Postgres user identity Lakebase expects.
  # This MUST be set to the application-id (UUID) of the Databricks App's
  # service principal — i.e. the SP that was granted CREATE on the database.
  # The value is known only after the app SP is provisioned; replace the
  # placeholder below with the actual SP application-id before deploying.
  # Example: "12345678-abcd-ef01-2345-6789abcdef01"
  # This app's service principal application-id (from `databricks apps list`).
  - name: LAKEBASE_DB_USER
    value: "1bead859-9de6-46ed-8621-0e9d9c23f70e"

  # GRAFANA_ROOT_URL: the public URL Grafana uses for redirects and links.
  # This is only known after the first deploy (Databricks Apps assigns the URL).
  # Set to https://<your-app-name>-<workspace-id>.databricksapps.com after
  # the first deploy completes.
  # The app owns its whole hostname (served at root, no sub-path), so
  # grafana_env._serve_from_sub_path() resolves GF_SERVER_SERVE_FROM_SUB_PATH
  # to false automatically from this URL.
  - name: GRAFANA_ROOT_URL
    value: "https://grafana-app-7474656259058151.aws.databricksapps.com"

  # Token refresh interval in seconds (default 3600 if unset; 3000 gives
  # comfortable margin before the 1h Lakebase token expiry).
  - name: TOKEN_REFRESH_INTERVAL_S
    value: "3000"

  # GRAFANA_AUTH_PROXY=true: trust the Databricks Apps SSO proxy's forwarded
  # identity headers (X-Forwarded-Email / X-Forwarded-Preferred-Username) for
  # auth. Users are auto-provisioned as Editor; anonymous access is disabled.
  # Leave unset locally (docker harness) to fall back to anonymous Admin.
  - name: GRAFANA_AUTH_PROXY
    value: "true"

  # DATABRICKS_WAREHOUSE_HTTP_PATH: enables the Databricks SQL warehouse
  # datasource (mullerpeter community plugin), authenticated via OAuth2 M2M
  # using the app SP's injected DATABRICKS_CLIENT_ID/SECRET. The SP needs
  # CAN_USE on this warehouse + access to the data it queries. Unset to skip.
  # fevm-classic-serverless warehouse id = de8680be2095a2e9.
  - name: DATABRICKS_WAREHOUSE_HTTP_PATH
    value: "sql/1.0/warehouses/de8680be2095a2e9"
